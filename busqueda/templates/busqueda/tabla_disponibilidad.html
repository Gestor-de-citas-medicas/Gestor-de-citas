<div class="content-box" style="animation: slideIn 0.3s ease-out;">
  <div style="margin-bottom: 20px;">
    <h3 style="font-family: 'DM Serif Display', serif; font-size: 1.4rem; font-weight: normal; margin-bottom: 8px;">Available Time Slots</h3>
    <p style="color: var(--text-muted); font-size: 0.85rem;">Dr. {{ doctor.nombre }}</p>
  </div>

  <div class="table-responsive">
    <table class="med-table" style="width: 100%;">
      <thead>
        <tr>
          <th>Date</th>
          <th>Time Slot</th>
        </tr>
      </thead>
      <tbody>
        {% for horario in horarios %}
        <tr>
          <td><i class="fa-regular fa-calendar" style="color: var(--text-muted); margin-right: 8px;"></i>{{ horario.fecha }}</td>
          <td style="color: var(--accent);"><i class="fa-regular fa-clock" style="margin-right: 8px;"></i>{{ horario.hora }}</td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="2" style="text-align: center; padding: 32px; color: var(--text-muted);">
            No available time slots.
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<style>
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
