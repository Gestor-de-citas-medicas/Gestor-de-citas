{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<!-- 🔥 BOTÓN (puedes quitarlo si ya entras directo) -->
<button class="btn-primary" onclick="openModal()">Edit Profile</button>

<!-- 🔥 MODAL -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-card">

    <h2>Edit Profile</h2>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="grid">
        <input type="text" name="first_name" placeholder="First name"
               value="{{ form.first_name.value|default:'' }}">

        <input type="text" name="last_name" placeholder="Last name"
               value="{{ form.last_name.value|default:'' }}">
      </div>

      <input type="email" name="email" placeholder="Email"
             value="{{ form.email.value|default:'' }}">

      {% if user.role == "DOCTOR" %}
      <select name="specialty">
        {% for value, label in form.fields.specialty.choices %}
          <option value="{{ value }}" {% if form.specialty.value == value %}selected{% endif %}>
            {{ label }}
          </option>
        {% endfor %}
      </select>

      <input type="text" name="phone" placeholder="Phone"
             value="{{ form.phone.value|default:'' }}">

      <textarea name="bio" placeholder="Bio">{{ form.bio.value|default:'' }}</textarea>

      <input type="file" name="avatar">
      {% endif %}

      <div class="actions">
        <button type="submit" class="btn-primary">Save</button>
        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
      </div>

    </form>

  </div>
</div>

{% endblock %}

{% block extra_head %}
<style>

/* 🔥 ESTO ES LO IMPORTANTE */
.modal-overlay {
  position: fixed !important;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,0.6);
  z-index: 999999;
}

.modal-card {
  background: #fff;
  padding: 30px;
  border-radius: 16px;
  width: 500px;
  max-width: 90%;
  box-shadow: 0 25px 60px rgba(0,0,0,0.3);
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

input, select, textarea {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.actions {
  margin-top: 15px;
  display: flex;
  gap: 10px;
}

</style>
{% endblock %}

{% block extra_js %}
<script>

/* 🔥 ABRIR AUTOMÁTICAMENTE */
window.onload = function() {
  document.getElementById("modalOverlay").style.display = "flex";
}

function openModal() {
  document.getElementById("modalOverlay").style.display = "flex";
}

function closeModal() {
  document.getElementById("modalOverlay").style.display = "none";
}

</script>
{% endblock %}
