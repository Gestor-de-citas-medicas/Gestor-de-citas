{% extends "base.html" %}

{% block title %}Doctor Dashboard — Calendar{% endblock %}

{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<style>

#calendar {
    background: white;
    padding: 10px;
    border-radius: 10px;
}

/* 🔥 líneas horizontales */
.fc-timegrid-slot {
    border-bottom: 1px solid #b0b0b0 !important;
}

/* 🔥 líneas verticales */
.fc-theme-standard td,
.fc-theme-standard th {
    border: 1px solid #c5c5c5 !important;
}

/* 🔥 eventos tipo celda */
.fc-event {

    opacity: 0.90 !important;

    border-radius: 0 !important;

    border: 1px solid rgba(0,0,0,0.15) !important;

    box-shadow: none !important;

    margin: 0 !important;
}

/* 🔥 ocupa bien la celda */
.fc-timegrid-event {
    inset: 0 !important;
}

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      z-index: 9999;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 30px;
      width: 90%;
      max-width: 480px;
      margin: auto;
      transform: translateY(20px);
      transition: transform .2s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem; font-weight: 400;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
      margin-bottom: 14px;
    }
    .form-group {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 14px;
    }

    .type-selector {
      display: flex; gap: 8px;
    }
    .type-btn {
      flex: 1; padding: 9px 6px;
      border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted);
      font-size: 0.8rem; cursor: pointer; transition: all .15s;
      font-family: 'DM Sans', sans-serif;
    }
    .type-btn.sel-available { background: var(--available); border-color: var(--available-border); color: var(--accent); }
    .type-btn.sel-blocked   { background: var(--blocked);   border-color: var(--blocked-border);   color: var(--danger); }

    .modal-actions {
      display: flex; gap: 10px; margin-top: 20px;
    }
    .btn-cancel {
      flex: 1; padding: 11px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-muted);
      font-size: 0.88rem; cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: border-color .15s;
    }
    .btn-cancel:hover { border-color: var(--text-muted); }
    .btn-save {
      flex: 2; padding: 11px;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      border: none; border-radius: 10px;
      color: #0d1117; font-weight: 600; font-size: 0.88rem;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: opacity .2s;
    }
    .btn-save:hover { opacity: .85; }
    .btn-delete {
      padding: 11px 18px;
      background: rgba(248,113,113,0.12);
      border: 1px solid var(--blocked-border);
      border-radius: 10px; color: var(--danger);
      font-size: 0.88rem; cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: background .15s;
    }
    .btn-delete:hover { background: rgba(248,113,113,0.22); }

    /* Toast */
    .toast {
      position: fixed; bottom: 28px; right: 28px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 20px;
      font-size: 0.88rem; z-index: 10000;
      transform: translateY(60px); opacity: 0;
      transition: all .3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-left: 3px solid var(--accent); }
    .toast.error   { border-left: 3px solid var(--danger); }
{% endblock %}

{% block sidebar_extra %}
  <button class="btn-add" onclick="openModal()">+ Nueva Disponibilidad</button>

  <div class="sidebar-section">
    <h3>Esta Semana</h3>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="stat-available">0</div>
        <div class="stat-lbl">Disponibles</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:var(--accent2)" id="stat-booked">0</div>
        <div class="stat-lbl">Reservadas</div>
      </div>
      <div class="stat-card" style="grid-column:span 2">
        <div class="stat-num" style="color:var(--danger)" id="stat-blocked">0</div>
        <div class="stat-lbl">Bloqueadas</div>
      </div>
    </div>
  </div>

  <div class="sidebar-section">
    <h3>Referencias</h3>
    <div class="legend-item"><div class="legend-dot dot-available"></div> Disponible</div>
    <div class="legend-item"><div class="legend-dot dot-booked"></div> Reservada</div>
    <div class="legend-item"><div class="legend-dot dot-blocked"></div> Bloqueada</div>
  </div>

  <div class="sidebar-section" style="margin-top:auto">
    <h3>Instrucciones</h3>
    <p style="font-size:0.78rem;color:var(--text-muted);line-height:1.5">
      Haz clic en un slot del calendario para agregar disponibilidad.<br><br>
      Haz clic en un evento existente para editarlo o eliminarlo.<br><br>
      Los slots <strong style="color:var(--danger)">bloqueados</strong> no serán visibles para los pacientes.
    </p>
  </div>
{% endblock %}

{% block content %}
<div class="view-actions-header">
  <h1>Doctor's Calendar</h1>
</div>

<div id="calendar"></div>

<!-- 🔥 MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">

    {% csrf_token %}

    <h2>New Availability</h2>

    <input type="date" id="input-date" class="input-control">

    <input type="time" id="input-start" class="input-control">

    <input type="time" id="input-end" class="input-control">

    <div style="margin-top: 15px;">
      <button class="btn-primary" onclick="saveEvent()">Save</button>
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
    </div>

  </div>
</div>

{% endblock %}

{% block sidebar_extra %}
<button class="btn-add" onclick="openModal()">+ New Availability</button>
{% endblock %}

{% block extra_js %}
<script>

let calendar;

document.addEventListener('DOMContentLoaded', function () {

    document.getElementById('modalOverlay').style.display = "none";

    calendar = new FullCalendar.Calendar(
        document.getElementById('calendar'),
        {

            initialView: 'timeGridWeek',

            selectable: true,

            allDaySlot: false,

            expandRows: true,

            slotDuration: '01:00:00',

            slotLabelInterval: '01:00',

            nowIndicator: false,

            events: function(info, successCallback, failureCallback) {

                fetch('/doctor/calendar/events/')
                    .then(res => res.json())
                    .then(data => successCallback(data))
                    .catch(err => failureCallback(err));
            },

            select: function(info) {

                document.getElementById("input-date").value =
                    info.startStr.slice(0,10);

                document.getElementById("input-start").value =
                    info.startStr.slice(11,16);

                document.getElementById("input-end").value =
                    info.endStr.slice(11,16);

                openModal();
            }

        }
    );

    calendar.render();
});

function openModal() {

    document.getElementById('modalOverlay').style.display = "flex";
}

function closeModal() {

    document.getElementById('modalOverlay').style.display = "none";
}

function saveEvent() {

    const date  = document.getElementById('input-date').value;

    const start = document.getElementById('input-start').value;

    const end   = document.getElementById('input-end').value;

    if (!date || !start || !end) {

        alert("Complete all fields");
        return;
    }

    if (start >= end) {

        alert("End time must be greater than start time");
        return;
    }

    const dayNumber = new Date(date).getDay();

    fetch("/doctor/schedule/create/", {

        method: "POST",

        headers: {
            "X-CSRFToken":
                document.querySelector(
                    '[name=csrfmiddlewaretoken]'
                ).value,

            "Content-Type":
                "application/x-www-form-urlencoded"
        },

        body:
            `day_number=${dayNumber}` +
            `&start_time=${start}` +
            `&end_time=${end}`
    })
    .then(res => res.json())
    .then(data => {

        if (data.ok) {

            alert("Saved ✅");

            calendar.refetchEvents();

            closeModal();

        } else {

            alert("Error backend");

            console.log(data);
        }
    })
    .catch(err => {

        console.error(err);

        alert("Server error real");
    });
}

</script>
{% endblock %}
