{% block extra_js %}
<script>

let calendar;

function showToast(msg, type='success') {

  const t = document.getElementById('toast');

  if (!t) return;

  t.textContent = msg;

  t.className = 'toast show ' + type;

  setTimeout(() => {
    t.className = 'toast';
  }, 3000);

}

function openModal() {

  const modal = document.getElementById('modalOverlay');

  if (modal) {
    modal.style.display = 'flex';
  }

}

function closeModal() {

  const modal = document.getElementById('modalOverlay');

  if (modal) {
    modal.style.display = 'none';
  }

}

document.addEventListener('DOMContentLoaded', function () {

  const calendarEl = document.getElementById('calendar');

  if (!calendarEl) {
    console.error('Calendar element not found');
    return;
  }

  if (typeof FullCalendar === 'undefined') {
    console.error('FullCalendar failed to load');
    return;
  }

  calendar = new FullCalendar.Calendar(
    calendarEl,
    {

      initialView: 'timeGridWeek',

      timeZone: 'local',

      height: 'auto',

      selectable: true,

      allDaySlot: false,

      nowIndicator: true,

      slotDuration: '01:00:00',

      slotLabelInterval: '01:00',

      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'timeGridWeek,timeGridDay'
      },

      buttonText: {
        today: 'Today',
        week: 'Week',
        day: 'Day'
      },

      events: function(info, successCallback, failureCallback) {

        fetch('/doctor/calendar/events/')

          .then(res => {

            if (!res.ok) {
              throw new Error('Failed loading events');
            }

            return res.json();

          })

          .then(data => {

            const now = new Date();

            const weekStart = new Date(now);

            weekStart.setHours(0,0,0,0);

            weekStart.setDate(
              now.getDate() - now.getDay()
            );

            const weekEnd = new Date(weekStart);

            weekEnd.setDate(
              weekStart.getDate() + 7
            );

            let avail = 0;
            let booked = 0;
            let blocked = 0;

            data.forEach(ev => {

              const s = new Date(ev.start);

              if (s >= weekStart && s < weekEnd) {

                if (ev.extendedProps?.type === 'booked') {

                  booked++;

                }
                else if (ev.extendedProps?.type === 'blocked') {

                  blocked++;

                }
                else {

                  avail++;

                }

              }

            });

            const statAvailable =
              document.getElementById('stat-available');

            const statBooked =
              document.getElementById('stat-booked');

            const statBlocked =
              document.getElementById('stat-blocked');

            if (statAvailable) {
              statAvailable.textContent = avail;
            }

            if (statBooked) {
              statBooked.textContent = booked;
            }

            if (statBlocked) {
              statBlocked.textContent = blocked;
            }

            successCallback(data);

          })

          .catch(err => {

            console.error(err);

            failureCallback(err);

            showToast(
              'Error loading calendar',
              'error'
            );

          });

      },

      select: function(info) {

        const start = info.start;

        const end = info.end;

        const year = start.getFullYear();

        const month = String(
          start.getMonth() + 1
        ).padStart(2, '0');

        const day = String(
          start.getDate()
        ).padStart(2, '0');

        const startHours = String(
          start.getHours()
        ).padStart(2, '0');

        const startMinutes = String(
          start.getMinutes()
        ).padStart(2, '0');

        const endHours = String(
          end.getHours()
        ).padStart(2, '0');

        const endMinutes = String(
          end.getMinutes()
        ).padStart(2, '0');

        const inputDate =
          document.getElementById('input-date');

        const inputStart =
          document.getElementById('input-start');

        const inputEnd =
          document.getElementById('input-end');

        if (inputDate) {
          inputDate.value =
            `${year}-${month}-${day}`;
        }

        if (inputStart) {
          inputStart.value =
            `${startHours}:${startMinutes}`;
        }

        if (inputEnd) {
          inputEnd.value =
            `${endHours}:${endMinutes}`;
        }

        openModal();

      }

    }
  );

  calendar.render();

});

function saveEvent() {

  const date =
    document.getElementById('input-date').value;

  const start =
    document.getElementById('input-start').value;

  const end =
    document.getElementById('input-end').value;

  if (!date || !start || !end) {

    showToast(
      'Please fill all fields ⚠️',
      'error'
    );

    return;

  }

  if (start >= end) {

    showToast(
      'End time must be after start time ⚠️',
      'error'
    );

    return;

  }

  /*
    FIX REAL:
    usar medianoche local
    NO usar T12:00:00
    NO usar UTC implícito
  */

  const localDate = new Date(
    date + 'T00:00:00'
  );

  const dayNumber = localDate.getDay();

  fetch('/doctor/schedule/create/', {

    method: 'POST',

    headers: {

      'X-CSRFToken':
        document.querySelector(
          '[name=csrfmiddlewaretoken]'
        ).value,

      'Content-Type':
        'application/x-www-form-urlencoded'

    },

    body:
      `day_number=${dayNumber}` +
      `&start_time=${start}` +
      `&end_time=${end}`

  })

  .then(res => {

    if (!res.ok) {
      throw new Error('Server error');
    }

    return res.json();

  })

  .then(data => {

    if (data.ok) {

      showToast(
        'Availability saved ✅',
        'success'
      );

      if (calendar) {
        calendar.refetchEvents();
      }

      closeModal();

    }
    else {

      showToast(
        'Error saving: ' +
        (data.error || 'Unknown'),
        'error'
      );

    }

  })

  .catch(err => {

    console.error(err);

    showToast(
      'Server error ❌',
      'error'
    );

  });

}

</script>
{% endblock %}
