{% block extra_js %}
<script>

let calendar;

function showToast(msg, type='success') {

  const t = document.getElementById('toast');

  t.textContent = msg;

  t.className = 'toast show ' + type;

  setTimeout(() => {
    t.className = 'toast';
  }, 3000);

}

function openModal() {

  document.getElementById('modalOverlay').style.display = 'flex';

}

function closeModal() {

  document.getElementById('modalOverlay').style.display = 'none';

}

document.addEventListener('DOMContentLoaded', function () {

  calendar = new FullCalendar.Calendar(
    document.getElementById('calendar'),
    {

      initialView: 'timeGridWeek',

      timeZone: 'local',

      height: 'auto',

      selectable: true,

      allDaySlot: false,

      nowIndicator: true,

      slotDuration: '01:00:00',

      slotLabelInterval: '01:00',

      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'timeGridWeek,timeGridDay'
      },

      buttonText: {
        today: 'Today',
        week: 'Week',
        day: 'Day'
      },

      events: function(info, successCallback, failureCallback) {

        fetch('/doctor/calendar/events/')

          .then(res => res.json())

          .then(data => {

            const now = new Date();

            const weekStart = new Date(now);

            weekStart.setDate(
              now.getDate() - now.getDay()
            );

            const weekEnd = new Date(weekStart);

            weekEnd.setDate(
              weekStart.getDate() + 7
            );

            let avail = 0;
            let booked = 0;
            let blocked = 0;

            data.forEach(ev => {

              const s = new Date(ev.start);

              if (s >= weekStart && s < weekEnd) {

                if (ev.extendedProps?.type === 'booked') {

                  booked++;

                }
                else if (ev.extendedProps?.type === 'blocked') {

                  blocked++;

                }
                else {

                  avail++;

                }

              }

            });

            document.getElementById(
              'stat-available'
            ).textContent = avail;

            document.getElementById(
              'stat-booked'
            ).textContent = booked;

            document.getElementById(
              'stat-blocked'
            ).textContent = blocked;

            successCallback(data);

          })

          .catch(err => {

            console.error(err);

            failureCallback(err);

          });

      },

      select: function(info) {

        const start = info.start;

        const end = info.end;

        const year = start.getFullYear();

        const month = String(
          start.getMonth() + 1
        ).padStart(2, '0');

        const day = String(
          start.getDate()
        ).padStart(2, '0');

        const startHours = String(
          start.getHours()
        ).padStart(2, '0');

        const startMinutes = String(
          start.getMinutes()
        ).padStart(2, '0');

        const endHours = String(
          end.getHours()
        ).padStart(2, '0');

        const endMinutes = String(
          end.getMinutes()
        ).padStart(2, '0');

        document.getElementById(
          'input-date'
        ).value = `${year}-${month}-${day}`;

        document.getElementById(
          'input-start'
        ).value = `${startHours}:${startMinutes}`;

        document.getElementById(
          'input-end'
        ).value = `${endHours}:${endMinutes}`;

        openModal();

      }

    }
  );

  calendar.render();

});

function saveEvent() {

  const date =
    document.getElementById('input-date').value;

  const start =
    document.getElementById('input-start').value;

  const end =
    document.getElementById('input-end').value;

  if (!date || !start || !end) {

    showToast(
      'Please fill all fields ⚠️',
      'error'
    );

    return;

  }

  if (start >= end) {

    showToast(
      'End time must be after start time ⚠️',
      'error'
    );

    return;

  }

  const selectedDate = new Date(
    date + 'T12:00:00'
  );

  const dayNumber = selectedDate.getDay();

  fetch('/doctor/schedule/create/', {

    method: 'POST',

    headers: {

      'X-CSRFToken':
        document.querySelector(
          '[name=csrfmiddlewaretoken]'
        ).value,

      'Content-Type':
        'application/x-www-form-urlencoded'

    },

    body:
      `day_number=${dayNumber}` +
      `&start_time=${start}` +
      `&end_time=${end}`

  })

  .then(res => res.json())

  .then(data => {

    if (data.ok) {

      showToast(
        'Availability saved ✅',
        'success'
      );

      calendar.refetchEvents();

      closeModal();

    }
    else {

      showToast(
        'Error saving: ' +
        (data.error || 'Unknown'),
        'error'
      );

    }

  })

  .catch(err => {

    console.error(err);

    showToast(
      'Server error ❌',
      'error'
    );

  });

}

</script>
{% endblock %}
