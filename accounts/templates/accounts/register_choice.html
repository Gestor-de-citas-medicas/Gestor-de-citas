{% extends "base.html" %}

{% block title %}Registration | Medical Appointment Manager{% endblock %}

{% block content %}
<div class="content-box" style="max-width: 480px; margin: 60px auto; text-align: center; border-radius: 20px;">
  <h1 style="font-family: 'DM Serif Display', serif; font-weight: normal; margin-bottom: 8px;">Create Account</h1>
  <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px;">Select the type of user account you want to create.</p>

  <a href="{% url 'patient_register' %}" style="display: block; background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 20px; color: var(--accent); text-decoration: none; margin-bottom: 16px; font-weight: 500; font-size: 1.1rem; transition: background .2s;">
    <i class="fa-solid fa-hospital-user"></i> Register as Patient
  </a>

  <a href="{% url 'doctor_register' %}" style="display: block; background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 20px; color: var(--accent2); text-decoration: none; margin-bottom: 24px; font-weight: 500; font-size: 1.1rem; transition: background .2s;">
    <i class="fa-solid fa-user-doctor"></i> Register as Doctor
  </a>

  <a href="{% url 'login' %}" style="color: var(--text-muted); font-size: 0.9rem; text-decoration: underline;">Back to Login</a>
</div>
{% endblock %}
