{# Chat Widget — included in base.html for PATIENT users #}
{# Solo visible para pacientes autenticados #}

<style>
  /* ── Chat Widget ── */
  .chat-toggle {
    position: fixed; bottom: 28px; right: 28px;
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #0ea5e9);
    border: none; cursor: pointer; z-index: 9990;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 24px rgba(45,212,191,0.35);
    transition: transform .2s, box-shadow .2s;
    font-size: 24px; color: #0d1117;
  }
  .chat-toggle:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 32px rgba(45,212,191,0.5);
  }
  .chat-toggle .badge-dot {
    position: absolute; top: 6px; right: 6px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--danger); border: 2px solid var(--bg);
    display: none;
  }
  .chat-toggle.has-new .badge-dot { display: block; }

  /* ── Chat Panel ── */
  .chat-panel {
    position: fixed; bottom: 100px; right: 28px;
    width: 400px; max-height: 560px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    z-index: 9991;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,0.5);
    transform: translateY(20px) scale(0.95);
    opacity: 0; pointer-events: none;
    transition: transform .25s cubic-bezier(.4,0,.2,1), opacity .25s;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .chat-panel.open {
    transform: translateY(0) scale(1);
    opacity: 1; pointer-events: all;
  }

  /* Header */
  .chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    background: linear-gradient(135deg, rgba(45,212,191,0.12), rgba(129,140,248,0.08));
    border-bottom: 1px solid var(--border);
  }
  .chat-header-left {
    display: flex; align-items: center; gap: 12px;
  }
  .chat-header-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .chat-header-title {
    font-weight: 600; font-size: 0.95rem; color: var(--text);
  }
  .chat-header-subtitle {
    font-size: 0.72rem; color: var(--text-muted);
  }
  .chat-header-actions {
    display: flex; gap: 6px;
  }
  .chat-header-btn {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; padding: 6px; border-radius: 6px;
    font-size: 0.9rem; transition: color .2s, background .2s;
  }
  .chat-header-btn:hover {
    color: var(--text); background: rgba(255,255,255,0.06);
  }

  /* Messages */
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    min-height: 300px; max-height: 380px;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb {
    background: var(--border); border-radius: 4px;
  }

  .chat-msg {
    max-width: 85%; padding: 10px 14px;
    border-radius: 14px; font-size: 0.88rem;
    line-height: 1.5; animation: msgIn .2s ease-out;
    word-wrap: break-word;
  }
  .chat-msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), #0ea5e9);
    color: #0d1117; border-bottom-right-radius: 4px;
  }
  .chat-msg.assistant {
    align-self: flex-start;
    background: var(--surface2);
    color: var(--text); border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }

  .chat-welcome {
    text-align: center; padding: 30px 20px;
    color: var(--text-muted);
  }
  .chat-welcome-icon {
    font-size: 2.5rem; margin-bottom: 12px;
  }
  .chat-welcome p { font-size: 0.85rem; line-height: 1.5; }

  .chat-typing {
    display: flex; gap: 4px; padding: 10px 14px;
    align-self: flex-start;
  }
  .chat-typing span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted); opacity: 0.5;
    animation: typing 1.4s infinite;
  }
  .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
  .chat-typing span:nth-child(3) { animation-delay: 0.4s; }

  /* Input */
  .chat-input-area {
    display: flex; gap: 8px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: rgba(22,27,34,0.5);
  }
  .chat-input {
    flex: 1; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); padding: 10px 14px;
    font-size: 0.88rem; font-family: 'DM Sans', sans-serif;
    outline: none; resize: none;
    transition: border-color .2s;
  }
  .chat-input:focus { border-color: var(--accent); }
  .chat-input::placeholder { color: var(--text-muted); }

  .chat-send {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #0ea5e9);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #0d1117; font-size: 1rem;
    transition: opacity .2s, transform .1s;
    flex-shrink: 0;
  }
  .chat-send:hover { opacity: 0.85; }
  .chat-send:active { transform: scale(0.95); }
  .chat-send:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Animations */
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Mobile */
  @media (max-width: 480px) {
    .chat-panel {
      right: 0; left: 0; bottom: 0;
      width: 100%; max-height: 100vh;
      border-radius: 20px 20px 0 0;
    }
    .chat-toggle { bottom: 20px; right: 20px; }
  }
</style>

<!-- Toggle Button -->
<button class="chat-toggle" id="chatToggle" onclick="toggleChat()" title="Asistente MAMP">
  <i class="fa-solid fa-robot"></i>
  <span class="badge-dot"></span>
</button>

<!-- Chat Panel -->
<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="chat-header-avatar">🤖</div>
      <div>
        <div class="chat-header-title">MAMP Assistant</div>
        <div class="chat-header-subtitle">Asistente médico inteligente</div>
      </div>
    </div>
    <div class="chat-header-actions">
      <button class="chat-header-btn" onclick="clearChat()" title="Limpiar chat">
        <i class="fa-solid fa-trash-can"></i>
      </button>
      <button class="chat-header-btn" onclick="toggleChat()" title="Cerrar">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="chat-welcome" id="chatWelcome">
      <div class="chat-welcome-icon">🏥</div>
      <p><strong>¡Hola!</strong> Soy tu asistente de MAMP.</p>
      <p style="margin-top: 8px;">Puedo ayudarte a buscar doctores, ver horarios disponibles y agendar citas. ¿En qué te ayudo?</p>
    </div>
  </div>

  <div class="chat-input-area">
    <input type="text" class="chat-input" id="chatInput"
           placeholder="Escribe tu mensaje..."
           onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage();}">
    <button class="chat-send" id="chatSend" onclick="sendMessage()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
</div>

<script>
(function() {
  const panel = document.getElementById('chatPanel');
  const input = document.getElementById('chatInput');
  const messagesEl = document.getElementById('chatMessages');
  const welcomeEl = document.getElementById('chatWelcome');
  const sendBtn = document.getElementById('chatSend');
  let isOpen = false;
  let isLoading = false;

  // CSRF token helper
  function getCookie(name) {
    const cookies = document.cookie.split(';');
    for (let c of cookies) {
      c = c.trim();
      if (c.startsWith(name + '=')) return decodeURIComponent(c.substring(name.length + 1));
    }
    return null;
  }

  // ── Toggle ──
  window.toggleChat = function() {
    isOpen = !isOpen;
    panel.classList.toggle('open', isOpen);
    if (isOpen) {
      input.focus();
      loadHistory();
    }
  };

  // ── Load history ──
  let historyLoaded = false;
  function loadHistory() {
    if (historyLoaded) return;
    historyLoaded = true;

    fetch('/chatbot/history/')
      .then(r => r.json())
      .then(data => {
        if (data.messages && data.messages.length > 0) {
          welcomeEl.style.display = 'none';
          data.messages.forEach(msg => {
            appendMessage(msg.role, msg.content, false);
          });
          scrollToBottom();
        }
      })
      .catch(() => {});
  }

  // ── Send message ──
  window.sendMessage = function() {
    const text = input.value.trim();
    if (!text || isLoading) return;

    // Hide welcome
    welcomeEl.style.display = 'none';

    // Append user message
    appendMessage('user', text);
    input.value = '';

    // Show typing indicator
    isLoading = true;
    sendBtn.disabled = true;
    const typingEl = showTyping();

    fetch('/chatbot/message/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken'),
      },
      body: JSON.stringify({ message: text }),
    })
    .then(r => r.json())
    .then(data => {
      removeTyping(typingEl);
      if (data.message) {
        appendMessage('assistant', data.message);
      } else if (data.error) {
        appendMessage('assistant', '⚠️ ' + data.error);
      }
    })
    .catch(err => {
      removeTyping(typingEl);
      appendMessage('assistant', '⚠️ Error de conexión. Intenta de nuevo.');
    })
    .finally(() => {
      isLoading = false;
      sendBtn.disabled = false;
      input.focus();
    });
  };

  // ── Clear chat ──
  window.clearChat = function() {
    fetch('/chatbot/clear/', {
      method: 'POST',
      headers: { 'X-CSRFToken': getCookie('csrftoken') },
    })
    .then(r => r.json())
    .then(() => {
      // Reset UI
      messagesEl.innerHTML = '';
      messagesEl.appendChild(welcomeEl);
      welcomeEl.style.display = '';
      historyLoaded = false;
    })
    .catch(() => {});
  };

  // ── Helpers ──
  function appendMessage(role, content, animate = true) {
    const div = document.createElement('div');
    div.className = `chat-msg ${role}`;
    if (!animate) div.style.animation = 'none';

    // Basic markdown-like formatting
    let html = content
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
    div.innerHTML = html;

    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'chat-typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function removeTyping(el) {
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }
})();
</script>
